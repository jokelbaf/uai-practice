<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СКД — Система Контролю Доступу</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060910;
    --bg2: #0c1017;
    --bg3: #111827;
    --card: #0f1623;
    --border: #1e2d42;
    --border-accent: #1e3a5f;
    --text: #c8d8e8;
    --text-dim: #4a6070;
    --text-muted: #2a3848;
    --accent: #1a6eb5;
    --accent-bright: #2d8cdb;
    --green: #10b981;
    --green-bg: #021f14;
    --green-border: #064e3b;
    --red: #ef4444;
    --red-bg: #1a0505;
    --red-border: #7f1d1d;
    --amber: #f59e0b;
    --amber-bg: #1a0f00;
    --blue: #38bdf8;
    --blue-bg: #021929;
    --blue-border: #0c4a6e;
    --font-mono: 'Share Tech Mono', monospace;
    --font-main: 'Exo 2', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-main);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
    pointer-events: none;
    z-index: 1000;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 56px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-bright), transparent);
    opacity: 0.4;
  }

  .header-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent-bright);
    letter-spacing: 2px;
  }
  .header-logo .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent-bright);
    box-shadow: 0 0 8px var(--accent-bright);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  .header-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text);
    position: absolute;
    left: 50%; transform: translateX(-50%);
  }
  .header-title span { color: var(--accent-bright); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  .clock {
    color: var(--text);
    font-size: 14px;
    letter-spacing: 1px;
  }
  .status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .status-indicator .dot-sm {
    width: 6px; height: 6px; border-radius: 50%;
  }

  /* SCREEN SWITCHER */
  .nav-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 24px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .nav-btn {
    padding: 6px 16px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--text); }
  .nav-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px rgba(29, 110, 181, 0.4);
  }
  .nav-btn.danger.active {
    background: var(--red);
    border-color: var(--red);
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
  }
  .nav-btn.warning.active {
    background: #b45309;
    border-color: #b45309;
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
  }

  /* ALERT BANNER */
  .alert-banner {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px 24px;
    background: var(--red-bg);
    border-bottom: 2px solid var(--red);
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--red);
  }
  .alert-banner.show { display: flex; animation: blink-bg 1s ease-in-out infinite; }
  .alert-banner .icon { font-size: 18px; }

  /* CAMERA GRID */
  .camera-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px 24px;
  }

  /* CAMERA PANEL */
  .cam-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .cam-panel.alert-cam { border-color: rgba(239, 68, 68, 0.5); }
  .cam-panel.error-cam { border-color: rgba(245, 158, 11, 0.4); }

  /* Camera top bar */
  .cam-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
  }
  .cam-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text);
  }
  .cam-label .cam-icon {
    width: 20px; height: 20px;
    border: 1px solid var(--accent);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--accent-bright);
  }
  .cam-id {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* Video feed */
  .cam-feed {
    position: relative;
    aspect-ratio: 16/9;
    background: #070c13;
    overflow: hidden;
  }
  .cam-feed-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Fake video noise/grid */
  .cam-feed-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(29,110,181,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(29,110,181,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .cam-feed-svg {
    opacity: 0.12;
    width: 60px;
    height: 60px;
  }

  /* Corner brackets */
  .bracket { position: absolute; width: 20px; height: 20px; }
  .bracket.tl { top: 8px; left: 8px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .bracket.tr { top: 8px; right: 8px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .bracket.bl { bottom: 8px; left: 8px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .bracket.br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

  /* LIVE badge */
  .live-badge {
    position: absolute;
    top: 8px; right: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    border-radius: 3px;
    padding: 2px 7px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: bold;
    color: var(--red);
    letter-spacing: 1px;
  }
  .live-badge.offline {
    color: var(--text-dim);
    border-color: var(--border);
    background: transparent;
  }
  .live-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse-live 1.2s ease-in-out infinite;
  }
  .live-badge.offline .live-dot {
    background: var(--text-dim);
    animation: none;
  }

  /* Cam number overlay */
  .cam-number {
    position: absolute;
    bottom: 8px;
    left: 8px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: rgba(200, 216, 232, 0.3);
    letter-spacing: 1px;
  }

  /* SENSOR ROW */
  .sensor-row {
    display: flex;
    gap: 6px;
    padding: 10px 10px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
  }

  /* Small alarm sensor */
  .sensor-sm {
    flex: 1;
    border-radius: 5px;
    padding: 6px 4px;
    text-align: center;
    border: 1px solid;
    transition: all 0.3s;
  }
  .sensor-sm .s-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    opacity: 0.7;
  }
  .sensor-sm .s-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }
  .sensor-sm .s-dot {
    width: 5px; height: 5px; border-radius: 50%;
  }
  .sensor-sm .s-val {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }

  /* Clean state */
  .sensor-sm.clean {
    background: var(--green-bg);
    border-color: var(--green-border);
    color: var(--green);
  }
  .sensor-sm.clean .s-dot { background: var(--green); box-shadow: 0 0 4px var(--green); }

  /* Dirty state */
  .sensor-sm.dirty {
    background: var(--red-bg);
    border-color: var(--red-border);
    color: var(--red);
  }
  .sensor-sm.dirty .s-dot {
    background: var(--red);
    box-shadow: 0 0 6px var(--red);
    animation: pulse-dot 0.8s ease-in-out infinite;
  }

  /* Unknown/offline */
  .sensor-sm.unknown {
    background: transparent;
    border-color: var(--text-muted);
    color: var(--text-muted);
  }
  .sensor-sm.unknown .s-dot { background: var(--text-muted); }

  /* Large status sensor */
  .sensor-lg {
    flex: 1.6;
    border-radius: 5px;
    padding: 6px 8px;
    border: 1px solid;
    transition: all 0.3s;
  }
  .sensor-lg .s-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
    opacity: 0.6;
  }
  .sensor-lg .s-status {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .sensor-lg .s-icon {
    font-size: 14px;
    line-height: 1;
  }
  .sensor-lg .s-text {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  /* Reading state */
  .sensor-lg.reading {
    background: var(--blue-bg);
    border-color: var(--blue-border);
    color: var(--blue);
  }

  /* Error state */
  .sensor-lg.error {
    background: var(--amber-bg);
    border-color: #92400e;
    color: var(--amber);
  }
  .sensor-lg.error .s-icon { animation: shake 0.5s ease-in-out infinite alternate; }

  /* FOOTER */
  .footer {
    padding: 8px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .footer-stats {
    display: flex;
    gap: 20px;
  }
  .footer-stat span { color: var(--text); }

  /* ANIMATIONS */
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }
  @keyframes pulse-live {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
  @keyframes blink-bg {
    0%, 100% { background-color: var(--red-bg); }
    50% { background-color: #2a0808; }
  }
  @keyframes shake {
    from { transform: rotate(-5deg); }
    to { transform: rotate(5deg); }
  }
  @keyframes critical-flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* Responsive */
  @media (max-width: 700px) {
    .camera-grid { grid-template-columns: 1fr; }
    .header-title { font-size: 11px; letter-spacing: 1px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-logo">
    <div class="dot"></div>
    <span>СКД</span>
  </div>
  <div class="header-title">Система <span>Контролю Доступу</span> — Моніторинг</div>
  <div class="header-right">
    <div class="status-indicator" id="sys-status">
      <div class="dot-sm" id="sys-dot" style="background:var(--green); box-shadow:0 0 6px var(--green);"></div>
      <span id="sys-text">ONLINE</span>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</header>

<!-- NAV BAR -->
<nav class="nav-bar">
  <button class="nav-btn active" onclick="switchScreen(0, this)">● НОРМА</button>
  <button class="nav-btn warning" onclick="switchScreen(1, this)">▲ ЧАСТКОВА ТРИВОГА</button>
  <button class="nav-btn warning" onclick="switchScreen(2, this)">⚠ ПОМИЛКА ЗВ'ЯЗКУ</button>
  <button class="nav-btn danger" onclick="switchScreen(3, this)">■ КРИТИЧНА ТРИВОГА</button>
</nav>

<!-- ALERT BANNER (shown on screen 4) -->
<div class="alert-banner" id="alert-banner">
  <span class="icon">⚠</span>
  <span>КРИТИЧНА ТРИВОГА — ВИКЛИКАТИ ОХОРОНУ — ЗОНА ПОРУШЕНА</span>
  <span class="icon">⚠</span>
</div>

<!-- SCREENS -->

<!-- SCREEN 1: НОРМА -->
<div class="screen active" id="screen-0">
  <div class="camera-grid" id="grid-0"></div>
</div>

<!-- SCREEN 2: ЧАСТКОВА ТРИВОГА -->
<div class="screen" id="screen-1">
  <div class="camera-grid" id="grid-1"></div>
</div>

<!-- SCREEN 3: ПОМИЛКА ЗВ'ЯЗКУ -->
<div class="screen" id="screen-2">
  <div class="camera-grid" id="grid-2"></div>
</div>

<!-- SCREEN 4: КРИТИЧНА ТРИВОГА -->
<div class="screen" id="screen-3">
  <div class="camera-grid" id="grid-3"></div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-stats">
    <span>КАМЕР: <span id="f-cams">4</span></span>
    <span>ДАТЧИКІВ: <span>20</span></span>
    <span>АКТИВНИХ: <span id="f-active">20</span></span>
    <span>ТРИВОГ: <span id="f-alerts">0</span></span>
  </div>
  <div>v2.4.1 © СКД MOНІТОРИНГ 2025</div>
</footer>

<script>
// Camera definitions
const cameras = [
  { id: 'CAM-01', name: 'Вхід — Головний', location: 'LOC:A1', sensors: ['Датчик 1','Датчик 2','Датчик 3','Датчик 4'] },
  { id: 'CAM-02', name: 'Склад — Секція А', location: 'LOC:B2', sensors: ['Датчик 1','Датчик 2','Датчик 3','Датчик 4'] },
  { id: 'CAM-03', name: 'Офіс — Поверх 2', location: 'LOC:C3', sensors: ['Датчик 1','Датчик 2','Датчик 3','Датчик 4'] },
  { id: 'CAM-04', name: 'Периметр — Ворота', location: 'LOC:D4', sensors: ['Датчик 1','Датчик 2','Датчик 3','Датчик 4'] },
];

// Screen states: per camera -> [s1, s2, s3, s4, status]
// s: 'clean'|'dirty'|'unknown', status: 'reading'|'error'
const screens = [
  // Screen 0: НОРМА
  [
    { alarms:['clean','clean','clean','clean'], status:'reading', live:true },
    { alarms:['clean','clean','clean','clean'], status:'reading', live:true },
    { alarms:['clean','clean','clean','clean'], status:'reading', live:true },
    { alarms:['clean','clean','clean','clean'], status:'reading', live:true },
  ],
  // Screen 1: ЧАСТКОВА ТРИВОГА
  [
    { alarms:['clean','dirty','clean','clean'], status:'reading', live:true },
    { alarms:['clean','clean','clean','clean'], status:'reading', live:true },
    { alarms:['dirty','clean','clean','dirty'], status:'reading', live:true },
    { alarms:['clean','clean','clean','clean'], status:'reading', live:true },
  ],
  // Screen 2: ПОМИЛКА ЗВ'ЯЗКУ
  [
    { alarms:['clean','clean','clean','clean'], status:'reading', live:true },
    { alarms:['unknown','unknown','unknown','unknown'], status:'error', live:false },
    { alarms:['clean','clean','clean','clean'], status:'reading', live:true },
    { alarms:['unknown','unknown','unknown','unknown'], status:'error', live:false },
  ],
  // Screen 3: КРИТИЧНА ТРИВОГА
  [
    { alarms:['dirty','dirty','clean','dirty'], status:'error', live:true },
    { alarms:['dirty','dirty','dirty','dirty'], status:'error', live:false },
    { alarms:['clean','dirty','dirty','dirty'], status:'error', live:true },
    { alarms:['dirty','dirty','dirty','dirty'], status:'error', live:false },
  ],
];

function sensorLabel(state) {
  if (state === 'clean') return 'ЧИСТО';
  if (state === 'dirty') return 'ГРЯЗНО';
  return '------';
}

function statusLabel(state) {
  if (state === 'reading') return { text: 'ЗЧИТУВАННЯ', icon: '↻' };
  return { text: 'ПОМИЛКА', icon: '⚠' };
}

function buildCameraPanel(cam, state, panelClass) {
  const st = statusLabel(state.status);
  const liveClass = state.live ? '' : 'offline';
  const liveDot = state.live ? '<div class="live-dot"></div>' : '<div class="live-dot"></div>';
  const liveText = state.live ? 'LIVE' : 'OFFLINE';

  const alarmBlocks = state.alarms.map((a, i) => `
    <div class="sensor-sm ${a}">
      <div class="s-label">${cam.sensors[i]}</div>
      <div class="s-indicator">
        <div class="s-dot"></div>
        <span class="s-val">${sensorLabel(a)}</span>
      </div>
    </div>
  `).join('');

  return `
    <div class="cam-panel ${panelClass}">
      <div class="cam-top">
        <div class="cam-label">
          <div class="cam-icon">▣</div>
          ${cam.name}
        </div>
        <div class="cam-id">${cam.id} · ${cam.location}</div>
      </div>
      <div class="cam-feed">
        <div class="cam-feed-inner">
          <div class="bracket tl"></div>
          <div class="bracket tr"></div>
          <div class="bracket bl"></div>
          <div class="bracket br"></div>
          <svg class="cam-feed-svg" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="15" width="50" height="35" rx="4" stroke="#2d8cdb" stroke-width="2"/>
            <circle cx="30" cy="32" r="9" stroke="#2d8cdb" stroke-width="2"/>
            <circle cx="30" cy="32" r="4" fill="#2d8cdb"/>
            <path d="M5 20 L0 15 L0 10 L5 10" stroke="#2d8cdb" stroke-width="2"/>
            <path d="M55 20 L60 15 L60 10 L55 10" stroke="#2d8cdb" stroke-width="2"/>
          </svg>
          <div class="live-badge ${liveClass}">
            ${liveDot}${liveText}
          </div>
          <div class="cam-number">${cam.id} / ${cam.location}</div>
        </div>
      </div>
      <div class="sensor-row">
        ${alarmBlocks}
        <div class="sensor-lg ${state.status}">
          <div class="s-label">СТАН ДАТЧИКА</div>
          <div class="s-status">
            <span class="s-icon">${st.icon}</span>
            <span class="s-text">${st.text}</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

// Build all screens
screens.forEach((screenData, si) => {
  const grid = document.getElementById(`grid-${si}`);
  screenData.forEach((camState, ci) => {
    const cam = cameras[ci];
    let panelClass = '';
    const hasAlarm = camState.alarms.some(a => a === 'dirty');
    const hasError = camState.status === 'error';
    if (hasAlarm) panelClass = 'alert-cam';
    if (hasError) panelClass = 'error-cam';
    grid.innerHTML += buildCameraPanel(cam, camState, panelClass);
  });
});

// Nav switching
function switchScreen(idx, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${idx}`).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  // Alert banner
  const banner = document.getElementById('alert-banner');
  banner.classList.toggle('show', idx === 3);

  // Footer stats
  const data = screens[idx];
  const alerts = data.reduce((sum, c) => sum + c.alarms.filter(a => a === 'dirty').length, 0);
  const errors = data.filter(c => c.status === 'error').length;
  document.getElementById('f-alerts').textContent = alerts;
  document.getElementById('f-active').textContent = 20 - data.reduce((sum,c) => sum + c.alarms.filter(a=>a==='unknown').length, 0);

  const sysDot = document.getElementById('sys-dot');
  const sysText = document.getElementById('sys-text');
  if (idx === 3) {
    sysDot.style.cssText = 'background:var(--red); box-shadow:0 0 8px var(--red);';
    sysText.textContent = 'ТРИВОГА';
  } else if (idx === 2) {
    sysDot.style.cssText = 'background:var(--amber); box-shadow:0 0 6px var(--amber);';
    sysText.textContent = 'ПОМИЛКА';
  } else {
    sysDot.style.cssText = 'background:var(--green); box-shadow:0 0 6px var(--green);';
    sysText.textContent = 'ONLINE';
  }
}

// Clock
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('uk-UA', { hour12: false });
}
tick();
setInterval(tick, 1000);
</script>
